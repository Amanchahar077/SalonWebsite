spring:
  datasource:
    url: jdbc:h2:mem:salondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - email
              - profile
  mail:
    host: localhost
    port: 2525
    username: test@salon.com
    password: testpassword

app:
  frontend-url: http://localhost:5173
  admin-email: admin@salon.com
  appointment:
    cancellation-window-hours: 2
    pending-expiration-minutes: 15

razorpay:
  key-id: rzp_test_dummykey
  key-secret: dummyserversecret
  webhook-secret: dummywebhooksecret
