server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: salon-booking-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/Salon_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  admin-email: ${APP_ADMIN_EMAIL}
  appointment:
    cancellation-window-hours: 2
    pending-expiration-minutes: 15

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_TTd08RDiBlwhbn}
  key-secret: ${RAZORPAY_KEY_SECRET:SutB6R72y23yOedJE8lFQXS7}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:dummywebhooksecret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
